[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nfl-predict"
version = "0.0.1"
description = "Reproducible NFL prediction pipeline (data -> features -> models -> backtesting -> decisions)."
# Conservative, verified range — see docs/ARCHITECTURE.md#python-version-policy.
# Upper bound excludes 3.14 deliberately: as of this writing, Polars (a direct dependency of
# nflreadpy, the project's nflverse loader) has no published 3.14 wheels, so 3.14 cannot
# actually install the `data` extra even though it may run the Phase 0 base package. Do not
# raise this bound just because a newer interpreter is present on a given machine — raise it
# once the full dependency stack (nflreadpy/polars/pyarrow/scikit-learn/lightgbm/xgboost) has
# verified wheels for the new version.
requires-python = ">=3.11,<3.14"
readme = "README.md"

# Phase 0 keeps runtime dependencies minimal: only what config loading and logging need.
# Later phases add their own dependency groups below rather than bloating the base install.
dependencies = [
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]
# Added when Phase 1 (data ingestion) actually lands.
# nflreadpy (not nfl_data_py, which is archived/deprecated) is the project's nflverse
# loader; it returns Polars DataFrames. polars is listed explicitly, not left as a transitive
# dependency, because ingestion code (src/nfl_predict/data) imports it directly at the
# ingestion boundary — see docs/ARCHITECTURE.md#tabular-data-representation-boundary for
# where Polars stops and pandas/pyarrow take over downstream. Pinned <0.2.0 because
# nflreadpy is pre-1.0 and may make breaking changes across minor versions.
data = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
    "polars>=0.20.0",
    "nflreadpy>=0.1.5,<0.2.0",
    "requests>=2.31",
]
# Added when Phase 3 (baseline models) actually lands.
modeling = [
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
]
# Added when Phase 8B (the read API) actually lands. httpx is listed explicitly because
# fastapi.testclient.TestClient requires it - never used for a live outbound HTTP call.
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]
# Added for Phase 10 (production storage) - only needed when NFL_STORAGE_BACKEND=postgres.
# Local development and the default sqlite backend have no dependency on this at all; see
# docs/ARCHITECTURE.md#storage and src/nfl_predict/storage/blob_store.py. `pgserver` is a
# real, embeddable Postgres binary (no Docker/system install needed) used ONLY by
# tests/storage/test_postgres_blob_store.py and tests/data/test_postgres_connection.py to
# run those tests against a genuine Postgres instance instead of leaving them skipped - see
# tests/conftest.py's `_ensure_test_postgres` hook.
postgres = [
    "psycopg[binary]>=3.1,<4",
    "pgserver>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
