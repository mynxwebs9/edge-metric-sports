  leakage_notes: 'Season-to-date: uses only this team''s games strictly before the current one within
    the same season; resets at season boundaries; never includes the current game''s own plays.'
  model_tracks:
  - independent
- name: def_redzone_td_rate_allowed_season
  category: defense
  description: Opponent red-zone-trip touchdown rate allowed. Same small-sample caution as off_redzone_td_rate.
  source_datasets:
  - pbp
  formula: count(opponent drives ending in TD among red-zone trips) / count(opponent red-zone trips)
  unit: rate_0_1
  rolling_window: season-to-date (resets each season; excludes the current game)
  min_observations: 1
  pregame_availability: Computable once at least one qualifying prior game/play exists this season; null
    otherwise.
  missing_value_policy: Null (never zero) if no qualifying prior plays exist this season yet (e.g. Week
    1, or a team with zero red-zone trips so far).
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: Small-sample situational stat (third down / red zone / turnovers can be single-digit
    counts early in a season) - do not treat as a stable rate without checking the underlying sample size.
  leakage_notes: 'Season-to-date: uses only this team''s games strictly before the current one within
    the same season; resets at season boundaries; never includes the current game''s own plays.'
  model_tracks:
  - independent
- name: def_int_rate_generated_season
  category: turnovers
  description: Interceptions generated per opponent true pass attempt (defense takeaway).
  source_datasets:
  - pbp
  formula: count(interception==1) / count(pass_attempt==1), grouped by defending team
  unit: rate_0_1
  rolling_window: season-to-date (resets each season; excludes the current game)
  min_observations: 1
  pregame_availability: Computable once at least one qualifying prior game/play exists this season; null
    otherwise.
  missing_value_policy: Null (never zero) if no qualifying prior plays exist this season yet (e.g. Week
    1, or a team with zero red-zone trips so far).
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: Small-sample situational stat (third down / red zone / turnovers can be single-digit
    counts early in a season) - do not treat as a stable rate without checking the underlying sample size.
  leakage_notes: 'Season-to-date: uses only this team''s games strictly before the current one within
    the same season; resets at season boundaries; never includes the current game''s own plays.'
  model_tracks:
  - independent
- name: def_fumble_forced_rate_season
  category: turnovers
  description: Opponent fumbles lost (i.e. recovered by this team's defense) per opponent offensive play
    (defense takeaway).
  source_datasets:
  - pbp
  formula: count(fumble_lost==1) / count(plays) where play_type in (pass, run), grouped by defending team
  unit: rate_0_1
  rolling_window: season-to-date (resets each season; excludes the current game)
  min_observations: 1
  pregame_availability: Computable once at least one qualifying prior game/play exists this season; null
    otherwise.
  missing_value_policy: Null (never zero) if no qualifying prior plays exist this season yet (e.g. Week
    1, or a team with zero red-zone trips so far).
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: Small-sample situational stat (third down / red zone / turnovers can be single-digit
    counts early in a season) - do not treat as a stable rate without checking the underlying sample size.
  leakage_notes: 'Season-to-date: uses only this team''s games strictly before the current one within
    the same season; resets at season boundaries; never includes the current game''s own plays.'
  model_tracks:
  - independent
- name: fg_pct_season
  category: special_teams
  description: Field goal make percentage, season-to-date.
  source_datasets:
  - pbp
  formula: count(field_goal_attempt==1 & field_goal_result=='made') / count(field_goal_attempt==1)
  unit: rate_0_1
  rolling_window: season-to-date (resets each season; excludes the current game)
  min_observations: 1
  pregame_availability: Computable once at least one qualifying prior game/play exists this season; null
    otherwise.
  missing_value_policy: Null (never zero) if no qualifying prior plays exist this season yet (e.g. Week
    1, or a team with zero red-zone trips so far).
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: Season-to-date only; no trailing-window variant is provided for this metric (see
    docs/PHASE2_FEATURE_REPORT.md's Feature windows rationale).
  leakage_notes: 'Season-to-date: uses only this team''s games strictly before the current one within
    the same season; resets at season boundaries; never includes the current game''s own plays.'
  model_tracks:
  - independent
- name: punt_yards_avg_season
  category: special_teams
  description: Average GROSS punt distance (kick_distance), season-to-date. NOT net of return yardage
    - true net punting (accounting for touchbacks, fair catches, out-of-bounds, and return yards) would
    need reconciling several edge cases this project isn't leaning on yet; documented as a known limitation
    rather than silently approximated. Return performance is deferred entirely.
  source_datasets:
  - pbp
  formula: sum(kick_distance) / count(kick_distance is not null) where play_type == 'punt'
  unit: yards_per_punt
  rolling_window: season-to-date (resets each season; excludes the current game)
  min_observations: 1
  pregame_availability: Computable once at least one qualifying prior game/play exists this season; null
    otherwise.
  missing_value_policy: Null (never zero) if no qualifying prior plays exist this season yet (e.g. Week
    1, or a team with zero red-zone trips so far).
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: Season-to-date only; no trailing-window variant is provided for this metric (see
    docs/PHASE2_FEATURE_REPORT.md's Feature windows rationale).
  leakage_notes: 'Season-to-date: uses only this team''s games strictly before the current one within
    the same season; resets at season boundaries; never includes the current game''s own plays.'
  model_tracks:
  - independent
- name: qb_primary_id
  category: quarterback
  description: The nflverse GSIS player_id of the quarterback identified as PRIMARY (most dropbacks) in
    this team's PREVIOUS completed game - not this game. Provided for audit/interpretability and as a
    categorical join key; not itself a numeric rate. See docs/PHASE2_FEATURE_REPORT.md's QB leakage-safety
    section.
  source_datasets:
  - pbp
  formula: passer_player_id (or rusher_player_id on a scramble) with the most qb_dropback==1 plays for
    this team in the PRIOR game
  unit: categorical_id
  rolling_window: none (single prior game)
  min_observations: 1
  pregame_availability: Known once the team has played at least one prior game this season or a prior
    season; null for a team's very first game in the dataset.
  missing_value_policy: Null if the team has no prior game (its first game in the entire 2010-2025 window).
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: Identifies who played the most, not necessarily the officially designated 'starter'
    (rare in-game benching could differ from who took the most first-half/most-total snaps, though this
    is uncommon).
  leakage_notes: 'CRITICAL: derived from the PREVIOUS game''s own play-by-play, which is safe because
    that game is fully completed before the target game''s kickoff. NEVER derived from the target game''s
    own starter identity - see docs/PHASE2_FEATURE_REPORT.md#qb-features-and-the-leakage-rule.'
  model_tracks:
  - independent
- name: qb_consecutive_starts
  category: quarterback
  description: Number of consecutive prior games (ending with the team's most recent completed game, within
    the current season) for which the SAME quarterback was primary. 0 if this is the team's first game
    of the season or the primary QB just changed.
  source_datasets:
  - pbp
  formula: running streak count of qb_primary_id staying constant across consecutive prior games this
    season
  unit: count
  rolling_window: none (running streak, season-scoped)
  min_observations: 1
  pregame_availability: 0 if no prior game this season; otherwise the streak as of the most recent prior
    game.
  missing_value_policy: 0 (not null) when there is no prior game this season - a real, meaningful zero
    (no continuity established yet), unlike a rate metric's missingness.
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: Resets to 0 at the start of every season, even if the same QB started every game
    of the prior season - continuity is intentionally not carried across the off-season boundary.
  leakage_notes: Built forward from completed prior games only; never looks at the target game's own QB.
  model_tracks:
  - independent
- name: qb_starts_season
  category: sample_size_support
  description: Number of this team's games so far this season (before the current one) where qb_primary_id
    was the primary QB. The sample-size denominator context for every other qb_*_season metric.
  source_datasets:
  - pbp
  formula: count of the primary QB's own prior primary-QB games this season
  unit: count
  rolling_window: season-to-date
  min_observations: 0
  pregame_availability: 0 if the primary QB has no prior starts this season (e.g. just became primary).
  missing_value_policy: 0, not null - a real count, including zero.
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: none identified
  leakage_notes: Counts only prior games; never the current one.
  model_tracks:
  - independent
- name: qb_epa_dropback_season
  category: quarterback
  description: Season-to-date EPA per dropback for THIS SPECIFIC QUARTERBACK (qb_primary_id), computed
    only from his own games as primary QB for this team this season - not the team's overall off_pass_epa_dropback_season,
    which includes any backup's snaps too.
  source_datasets:
  - pbp
  formula: sum(his pass_epa_sum across his own prior primary-QB games) / sum(his dropback_n across those
    games)
  unit: epa_per_dropback
  rolling_window: season-to-date, scoped to this QB's own starts
  min_observations: 1
  pregame_availability: Null until the primary QB has at least 1 prior game as primary this season.
  missing_value_policy: Null (not zero) if qb_starts_season == 0.
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: A backup making his first start has no data here (null) even if the team's own off_pass_epa_dropback_season
    has plenty of history from the previous starter - this is intentional, not a bug.
  leakage_notes: Scoped to the identified QB's own PRIOR games only; never his performance in the target
    game.
  model_tracks:
  - independent
- name: qb_success_rate_season
  category: quarterback
  description: Season-to-date dropback success rate for the primary QB specifically (see qb_epa_dropback_season).
  source_datasets:
  - pbp
  formula: sum(his pass_success_sum) / sum(his dropback_n) across his own prior primary-QB games this
    season
  unit: rate_0_1
  rolling_window: season-to-date, scoped to this QB's own starts
  min_observations: 1
  pregame_availability: Null until qb_starts_season >= 1.
  missing_value_policy: Null if qb_starts_season == 0.
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: Same new-starter caveat as qb_epa_dropback_season.
  leakage_notes: Same as qb_epa_dropback_season.
  model_tracks:
  - independent
- name: qb_sack_rate_season
  category: quarterback
  description: Season-to-date sack rate taken by the primary QB specifically, per his own true pass attempts.
  source_datasets:
  - pbp
  formula: sum(his sack_n) / sum(his pass_attempt_n) across his own prior primary-QB games this season
  unit: rate_0_1
  rolling_window: season-to-date, scoped to this QB's own starts
  min_observations: 1
  pregame_availability: Null until qb_starts_season >= 1.
  missing_value_policy: Null if qb_starts_season == 0 or his pass_attempt_n sum is 0.
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: Conflates QB-specific tendencies (e.g. holding the ball longer) with O-line pass
    protection - not decomposed in Phase 2.
  leakage_notes: Same as qb_epa_dropback_season.
  model_tracks:
  - independent
- name: qb_int_rate_season
  category: quarterback
  description: Season-to-date interception rate thrown by the primary QB specifically, per his own true
    pass attempts.
  source_datasets:
  - pbp
  formula: sum(his int_n) / sum(his pass_attempt_n) across his own prior primary-QB games this season
  unit: rate_0_1
  rolling_window: season-to-date, scoped to this QB's own starts
  min_observations: 1
  pregame_availability: Null until qb_starts_season >= 1.
  missing_value_policy: Null if qb_starts_season == 0.
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: Interceptions are a noisy outcome even for a full season, let alone the partial-season
    samples typical early on - see docs/PHASE2_FEATURE_REPORT.md's turnovers caveat.
  leakage_notes: Same as qb_epa_dropback_season.
  model_tracks:
  - independent
- name: qb_cpoe_season
  category: quarterback
  description: Season-to-date completion percentage over expected for the primary QB specifically.
  source_datasets:
  - pbp
  formula: sum(his cpoe_sum) / sum(his cpoe_n) across his own prior primary-QB games this season
  unit: percentage_points
  rolling_window: season-to-date, scoped to this QB's own starts
  min_observations: 1
  pregame_availability: Null until qb_starts_season >= 1.
  missing_value_policy: Null if qb_starts_season == 0 or he has no plays with a defined CPOE yet.
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: none identified beyond the general new-starter null behavior.
  leakage_notes: Same as qb_epa_dropback_season.
  model_tracks:
  - independent
- name: qb_scramble_epa_season
  category: quarterback
  description: Season-to-date EPA generated specifically on scramble plays by the primary QB (his rushing-while-passing-down
    contribution), normalized per his total dropbacks (not per scramble) so it reflects overall value
    added via scrambling rather than scramble efficiency alone.
  source_datasets:
  - pbp
  formula: sum(his scramble_epa_sum) / sum(his dropback_n) across his own prior primary-QB games this
    season
  unit: epa_per_dropback
  rolling_window: season-to-date, scoped to this QB's own starts
  min_observations: 1
  pregame_availability: Null until qb_starts_season >= 1.
  missing_value_policy: Null if qb_starts_season == 0; a QB who never scrambles will show a value near
    0, not null, once he has starts (correctly reflecting a real, small/zero scramble contribution).
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: Scramble volume is low for most QBs; this can be a near-zero, low-signal value for
    pocket passers.
  leakage_notes: Same as qb_epa_dropback_season.
  model_tracks:
  - independent
- name: off_snap_continuity_pct
  category: personnel_continuity
  description: Share of the team's offensive snaps in its MOST RECENT completed game that went to players
    who ALSO played offensive snaps (any amount) in the game before that. A roster-stability signal heading
    into the next game - never involves the target game's own personnel.
  source_datasets:
  - snap_counts
  formula: sum(off_snaps in game N-1 for players present in game N-2) / sum(off_snaps in game N-1)
  unit: rate_0_1
  rolling_window: prior two completed games only (not a multi-game rolling window)
  min_observations: 2
  pregame_availability: Requires the team to have at least 2 prior completed games with snap_counts coverage
    (2013+ - see docs/PHASE1_DATA_REPORT.md); null before that.
  missing_value_policy: Null if fewer than 2 prior games have snap_counts data (includes all of 2010-2012,
    and a team's first 2 games of 2013).
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 2013
  known_limitations: snap_counts identifies players by pfr_player_id (Pro-Football-Reference), a different
    ID namespace than play-by-play's GSIS ids - continuity is computed self-referentially within snap_counts
    alone, never cross-joined to pbp player ids, precisely to avoid needing an unbuilt ID crosswalk. Position-specific
    (e.g. offensive-line-only) continuity is deferred - see docs/PHASE2_FEATURE_REPORT.md.
  leakage_notes: Uses only the team's own two most recent COMPLETED prior games; never the target game's
    roster.
  model_tracks:
  - independent
- name: def_snap_continuity_pct
  category: personnel_continuity
  description: Share of the team's defensive snaps in its MOST RECENT completed game that went to players
    who ALSO played defensive snaps (any amount) in the game before that. A roster-stability signal heading
    into the next game - never involves the target game's own personnel.
  source_datasets:
  - snap_counts
  formula: sum(def_snaps in game N-1 for players present in game N-2) / sum(def_snaps in game N-1)
  unit: rate_0_1
  rolling_window: prior two completed games only (not a multi-game rolling window)
  min_observations: 2
  pregame_availability: Requires the team to have at least 2 prior completed games with snap_counts coverage
    (2013+ - see docs/PHASE1_DATA_REPORT.md); null before that.
  missing_value_policy: Null if fewer than 2 prior games have snap_counts data (includes all of 2010-2012,
    and a team's first 2 games of 2013).
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 2013
  known_limitations: snap_counts identifies players by pfr_player_id (Pro-Football-Reference), a different
    ID namespace than play-by-play's GSIS ids - continuity is computed self-referentially within snap_counts
    alone, never cross-joined to pbp player ids, precisely to avoid needing an unbuilt ID crosswalk. Position-specific
    (e.g. offensive-line-only) continuity is deferred - see docs/PHASE2_FEATURE_REPORT.md.
  leakage_notes: Uses only the team's own two most recent COMPLETED prior games; never the target game's
    roster.
  model_tracks:
  - independent
- name: days_rest
  category: rest_situational
  description: Days between this team's previous game and this one.
  source_datasets:
  - schedules
  formula: this game's kickoff date minus the team's previous game's kickoff date, in days
  unit: days
  rolling_window: none
  min_observations: 1
  pregame_availability: Known as soon as the schedule is published - long before kickoff.
  missing_value_policy: Null if there is no previous game (team's first game in the dataset) or the gap
    exceeds 30 days (an off-season gap is not 'rest' in any football sense).
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: none identified
  leakage_notes: Pure schedule metadata; not derived from any play data.
  model_tracks:
  - independent
- name: opponent_days_rest
  category: rest_situational
  description: Days between the OPPONENT's previous game and this one (same definition as days_rest, evaluated
    for the opponent).
  source_datasets:
  - schedules
  formula: same as days_rest, looked up for the opponent's own row for this same game_id
  unit: days
  rolling_window: none
  min_observations: 1
  pregame_availability: Known as soon as the schedule is published.
  missing_value_policy: Null under the same conditions as days_rest.
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: none identified
  leakage_notes: Same-game lookup of public schedule information, not a cross-game leak.
  model_tracks:
  - independent
- name: rest_diff
  category: rest_situational
  description: days_rest minus opponent_days_rest - positive means this team has a rest advantage.
  source_datasets:
  - schedules
  formula: days_rest - opponent_days_rest
  unit: days
  rolling_window: none
  min_observations: 1
  pregame_availability: Known once both teams' days_rest are known.
  missing_value_policy: Null if either days_rest or opponent_days_rest is null.
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: none identified
  leakage_notes: Derived from two already-safe values.
  model_tracks:
  - independent
- name: is_neutral_site
  category: rest_situational
  description: True if the game is played at a neutral site (not either team's home stadium) - e.g. international
    games.
  source_datasets:
  - schedules
  formula: raw schedules snapshot's location column == 'Neutral'
  unit: boolean
  rolling_window: none
  min_observations: 1
  pregame_availability: Known as soon as the schedule is published.
  missing_value_policy: Defaults to False if the raw schedules snapshot lacks a location column for that
    season (should not occur in the 2010-2025 window; documented as a defensive default, not an expected
    case).
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: none identified
  leakage_notes: Pure schedule metadata.
  model_tracks:
  - independent
- name: is_divisional_game
  category: rest_situational
  description: True if the team and opponent are in the same division (per the normalized teams table's
    division field).
  source_datasets:
  - schedules
  - teams
  formula: team's division == opponent's division
  unit: boolean
  rolling_window: none
  min_observations: 1
  pregame_availability: Known as soon as the schedule is published.
  missing_value_policy: False if either team's division cannot be resolved (should not occur for any team
    in the 2010-2025 window).
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: Uses each team's CURRENT division mapping, not any historical realignment - not a
    concern for 2010-2025 (no divisional realignment occurred in this window).
  leakage_notes: Pure schedule/team metadata.
  model_tracks:
  - independent
- name: short_week
  category: rest_situational
  description: True if days_rest <= short_week_max_rest_days (config/feature_engine.yaml; 6 as of this
    writing) - e.g. a Thursday game following a Sunday game.
  source_datasets:
  - schedules
  formula: days_rest <= short_week_max_rest_days
  unit: boolean
  rolling_window: none
  min_observations: 1
  pregame_availability: Known as soon as the schedule is published.
  missing_value_policy: False when days_rest is null (treated as 'not proven short', not as True or missing).
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: none identified
  leakage_notes: Derived from days_rest, already safe.
  model_tracks:
  - independent
- name: post_bye
  category: rest_situational
  description: True if days_rest >= post_bye_min_rest_days (config/feature_engine.yaml; 12 as of this
    writing) - a conservative floor meant to catch bye-week returns.
  source_datasets:
  - schedules
  formula: days_rest >= post_bye_min_rest_days
  unit: boolean
  rolling_window: none
  min_observations: 1
  pregame_availability: Known as soon as the schedule is published.
  missing_value_policy: False when days_rest is null.
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: A conservative rest-day floor, not a direct 'was this team on a bye' flag from the
    schedule - could theoretically also catch a non-bye long-gap edge case (e.g. around a postponed game),
    though none is known to occur in 2010-2025.
  leakage_notes: Derived from days_rest, already safe.
  model_tracks:
  - independent
- name: opp_off_epa_faced_season
  category: opponent_quality
  description: Average of each opponent's OWN offensive pregame season-to-date rating (off_epa_pp_season)
    at the time this team played them, averaged across all of this team's meetings so far this season.
    A simple 'strength of schedule faced' signal - deliberately NOT a learned opponent-adjustment model
    (see docs/PHASE2_FEATURE_REPORT.md#opponent-context).
  source_datasets:
  - pbp
  formula: mean over this team's prior meetings this season of (that opponent's own off_epa_pp_season
    value AS OF that specific meeting)
  unit: epa_per_play
  rolling_window: season-to-date
  min_observations: 1
  pregame_availability: Null until this team has played at least 1 game this season.
  missing_value_policy: Null if no prior meetings this season, or if none of those opponents had their
    own rating available at the time (extremely rare - only a team's own first-ever game would lack it).
  opponent_adjusted: true
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: A simple average of opponent quality faced, not a true strength-of-schedule adjustment
    (e.g. no recursive convergence, no accounting for how many games each opponent's own rating was based
    on) - Phase 3 may build a more rigorous opponent-adjustment model if warranted.
  leakage_notes: Each opponent's rating used here is itself already leakage-safe (their own season-to-date
    value AS OF that specific meeting, never including games after it); averaging already-safe values
    across this team's own prior meetings introduces no new leakage.
  model_tracks:
  - independent
- name: opp_def_epa_faced_season
  category: opponent_quality
  description: Average of each opponent's OWN defensive pregame season-to-date rating (def_epa_pp_allowed_season)
    at the time this team played them, averaged across all of this team's meetings so far this season.
    A simple 'strength of schedule faced' signal - deliberately NOT a learned opponent-adjustment model
    (see docs/PHASE2_FEATURE_REPORT.md#opponent-context).
  source_datasets:
  - pbp
  formula: mean over this team's prior meetings this season of (that opponent's own def_epa_pp_allowed_season
    value AS OF that specific meeting)
  unit: epa_per_play
  rolling_window: season-to-date
  min_observations: 1
  pregame_availability: Null until this team has played at least 1 game this season.
  missing_value_policy: Null if no prior meetings this season, or if none of those opponents had their
    own rating available at the time (extremely rare - only a team's own first-ever game would lack it).
  opponent_adjusted: true
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: A simple average of opponent quality faced, not a true strength-of-schedule adjustment
    (e.g. no recursive convergence, no accounting for how many games each opponent's own rating was based
    on) - Phase 3 may build a more rigorous opponent-adjustment model if warranted.
  leakage_notes: Each opponent's rating used here is itself already leakage-safe (their own season-to-date
    value AS OF that specific meeting, never including games after it); averaging already-safe values
    across this team's own prior meetings introduces no new leakage.
  model_tracks:
  - independent
