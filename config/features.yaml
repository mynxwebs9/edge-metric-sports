- name: redzone_trips_n
  category: sample_size_support
  description: Number of red-zone drive trips THIS team had in the CURRENT game (not rolled - sample-size
    context for off_redzone_td_rate_season's denominator across games).
  source_datasets:
  - pbp
  formula: count of drives reaching yardline_100<=20 for this team's offense, this game
  unit: count
  rolling_window: none (single game)
  min_observations: 0
  pregame_availability: This is a POST-GAME count for a completed game, used only as historical sample-size
    context for rolling other teams' rates - never used as a pregame feature for the game it describes.
  missing_value_policy: Null if the game's play-by-play has no red-zone drives recorded (rare but possible
    in a defensive struggle).
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: Describes THIS game's own red-zone trip count, not a rolled/trailing value - context
    for interpreting off_redzone_td_rate_season's reliability, not a pregame predictor on its own.
  leakage_notes: Not used as a feature for the game it describes; only ever consumed as historical input
    to LATER games' off_redzone_td_rate_season.
  model_tracks:
  - independent
