# Declarative feature registry - machine-readable mirror of docs/FEATURE_DICTIONARY.md.
#
# GENERATED by scripts/generate_feature_registry.py from the authoritative metric
# definitions in src/nfl_predict/features/team_game.py. Do not hand-edit entries whose
# formula/window is generated from a MetricSpec - change team_game.py and re-run the
# generator instead, or this file will drift from what the code actually computes.
# Hand-maintained sections (QB/personnel/situational/opponent/prev-season/sample-size)
# live in the generator script itself, not here, for the same reason.
#
# Identity/bookkeeping columns (game_id, season, season_type, week, game_date,
# kickoff_time_naive, as_of_timestamp, team_id, opponent_id, venue) and `is_home` are
# deliberately NOT registered here - see docs/FEATURE_DICTIONARY.md's "Identity &
# context columns" section.
#
# The game-level feature table (src/nfl_predict/features/game_table.py) is not
# separately registered either: home_<name>/away_<name> are just this team-game
# feature evaluated for each side of the game, and diff_<name> = home_<name> -
# away_<name>, a mechanical transform of two already-registered values - not a new
# feature definition of its own.

features:
- name: off_epa_pp_3g
  category: offense
  description: Offensive expected points added (EPA) per play, averaged over offensive plays (pass or
    designed run attempts; excludes kickoffs, punts, field goals, extra points, qb_kneel, and qb_spike).
  source_datasets:
  - pbp
  formula: sum(epa) / count(plays) where play_type in (pass, run)
  unit: epa_per_play
  rolling_window: trailing 3 games (does not reset at season boundaries; a Week 1 game's trailing window
    may include games from the end of the prior season)
  min_observations: 1
  pregame_availability: Computable once the minimum observation count of prior qualifying games/plays
    is met; null otherwise (see missing_value_policy).
  missing_value_policy: Null (never zero) if the team has fewer than min_observations qualifying prior
    games in this window, OR if the window's underlying play count is zero. Sample size is visible via
    the shared n_games_trailing_3 column.
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 1999
  known_limitations: Early in a season (or early in a team's trailing window), sample size is small; does
    not imply the underlying rate is unstable, but confidence should scale with the sample-size column.
  leakage_notes: 'Trailing 3-game window: uses this team''s 3 most recent completed games strictly before
    the current one, computed as a rolled sum of the window''s raw event counts/EPA divided by the rolled
    play count (not an average of per-game rates), so games with more plays are weighted correctly. Never
    includes the current game''s own plays.'
  model_tracks:
  - independent
