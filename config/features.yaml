  unit: epa_per_play
  rolling_window: full previous season (every game, no exclusion)
  min_observations: 1
  pregame_availability: Known for any team that played in the immediately preceding season; null for a
    team's first season in the 2010-2025 window (2010 itself) or after not existing the prior season.
  missing_value_policy: Null (see has_prev_season_data) if the team has no data for the immediately preceding
    season.
  opponent_adjusted: false
  garbage_time_filtered: false
  earliest_reliable_season: 2011
  known_limitations: A full-season average, computed once and held constant across every game of the following
    season - never blended with in-season current-year values using any weighting; Phase 3 decides how
    (or whether) to combine them.
  leakage_notes: Uses ONLY the complete prior season's games (season S-1), attached to every game of season
    S; never includes any game from season S itself.
  model_tracks:
  - independent
